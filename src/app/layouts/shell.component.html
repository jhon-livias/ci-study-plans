<div class="shell">
  <a class="skip-link" href="#main-content">Ir al contenido principal</a>
  <header class="header">
    <div class="container bar">
      <ui-brand />
      <div class="session">
        <span>{{ auth.user()?.displayName || auth.user()?.username }}</span>
        <ui-button variant="soft" (click)="logout()">Salir</ui-button>
      </div>
    </div>
  </header>
  <main id="main-content" class="main" tabindex="-1">
    <div class="container">
      <router-outlet />
    </div>
  </main>
</div>
